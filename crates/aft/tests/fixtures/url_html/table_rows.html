<!doctype html>
<!-- highlight.js line-numbers plugin layout: one <tr> per source line, an
     empty line-number <div> (the number is drawn by CSS from data-line-number),
     and the code in a second cell, with no newline text anywhere. Line 3 is
     blank: its code <div> is empty. -->
<html>
<body>
<h2>Table rows</h2>
<pre><code class="hljs language-python"><table class="hljs-ln"><tbody><tr><td class="hljs-ln-line hljs-ln-numbers" data-line-number="1"><div class="hljs-ln-n" data-line-number="1"></div></td><td class="hljs-ln-line hljs-ln-code" data-line-number="1"><div class="hljs-ln-line"><span class="hljs-keyword">def</span> <span class="hljs-title">add</span>(a, b):</div></td></tr><tr><td class="hljs-ln-line hljs-ln-numbers" data-line-number="2"><div class="hljs-ln-n" data-line-number="2"></div></td><td class="hljs-ln-line hljs-ln-code" data-line-number="2"><div class="hljs-ln-line">    <span class="hljs-keyword">return</span> a + b</div></td></tr><tr><td class="hljs-ln-line hljs-ln-numbers" data-line-number="3"><div class="hljs-ln-n" data-line-number="3"></div></td><td class="hljs-ln-line hljs-ln-code" data-line-number="3"><div class="hljs-ln-line"></div></td></tr><tr><td class="hljs-ln-line hljs-ln-numbers" data-line-number="4"><div class="hljs-ln-n" data-line-number="4"></div></td><td class="hljs-ln-line hljs-ln-code" data-line-number="4"><div class="hljs-ln-line">print(add(1, 2))</div></td></tr></tbody></table></code></pre>
<p>After the block.</p>
</body>
</html>
