<!doctype html>
<!-- Per-line <div> code layout: each source line is its own block element with
     no newline text between lines. A blank line is a <div> holding <br>. -->
<html>
<body>
<h2>Per-line divs</h2>
<pre class="code-block"><code class="language-js"><div class="line"><span class="kw">function</span> <span class="fn">greet</span>(name) {</div><div class="line">  <span class="kw">return</span> <span class="str">`Hello, ${name}`</span>;</div><div class="line"><br></div><div class="line">}</div></code></pre>
<p>After the block.</p>
</body>
</html>
